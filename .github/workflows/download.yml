# Builds na-VIM.zip (just the extension, in a folder named na-VIM) and
# attaches it to the release for the manifest's version. The README's
# Download button points at the latest release's na-VIM.zip.
name: Download zip

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # .gitattributes export-ignore keeps docs, tools and README out
      - name: Build na-VIM.zip
        run: git archive --format=zip --prefix=na-VIM/ -o na-VIM.zip HEAD

      - name: Attach it to this version's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(jq -r .version manifest.json)"
          gh release view "$v" >/dev/null 2>&1 || gh release create "$v" --title "NaVIM $v" \
            --notes "Unzip, then load the na-VIM folder as an unpacked extension."
          gh release upload "$v" na-VIM.zip --clobber
