<!doctype html>
<meta charset="utf-8">
<title>NaVIM icon concepts</title>
<style>
  body { margin: 0; padding: 28px; background: #1c1c1e; color: #aaa; font: 13px -apple-system, sans-serif; display: flex; gap: 36px; }
  .c { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .row { display: flex; align-items: end; gap: 12px; }
  .light { background: #f2f2f2; padding: 6px; border-radius: 6px; display: flex; gap: 8px; align-items: end; }
  b { color: #fff; font-size: 15px; }
</style>
<body></body>
<script src="../src/font.js"></script>
<script src="../src/dotmatrix.js"></script>
<script>
  const NS = 'http://www.w3.org/2000/svg';
  const bytes = Uint8Array.from(atob(NaVIM.fontData), c => c.charCodeAt(0));
  const face = new FontFace('Gohu', bytes.buffer);
  document.fonts.add(face);

  const dots = (rows, cx, cy, pitch, r) => {
    const w = rows[0].length * pitch, h = rows.length * pitch;
    let d = '';
    rows.forEach((row, y) => [...row].forEach((c, x) => {
      if (c !== '#') return;
      const px = cx - w / 2 + (x + 0.5) * pitch, py = cy - h / 2 + (y + 0.5) * pitch;
      d += `M${px - r} ${py}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0`;
    }));
    return `<path d="${d}" fill="#fff"/>`;
  };
  const tile = inner => `<svg xmlns="${NS}" viewBox="0 0 128 128"><rect width="128" height="128" rx="28" fill="#000"/><rect x="0.75" y="0.75" width="126.5" height="126.5" rx="27.5" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="1.5"/>${inner}</svg>`;

  const OPTION = ['###..####', '...#.....', '....#....', '.....#...', '......###'];

  const concepts = [
    ['A · dot N', 'the dot-matrix look from your timer', tile(dots(NaVIM.dots.glyphs.N, 64, 64, 13, 5))],
    ['B · Gohu NV', 'pixel-font monogram, like the hint labels', tile(`<text x="64" y="86" text-anchor="middle" font-family="Gohu" font-size="56" fill="#fff">NV</text>`)],
    ['C · dot ⌥', 'the right-Option key it runs on', tile(dots(OPTION, 64, 64, 12, 4.6))],
    ['D · hint tag', 'a link with its label on it', tile(`
      <rect x="22" y="30" width="58" height="44" rx="7" fill="#fff"/>
      <text x="51" y="66" text-anchor="middle" font-family="Gohu" font-size="42" fill="#000">F</text>
      <rect x="22" y="88" width="84" height="7" rx="1" fill="#fff" fill-opacity=".55"/>`)],
  ];

  face.load().then(() => {
    for (const [name, note, svg] of concepts) {
      // inline, not <img>: SVG images can't see the page's Gohu FontFace
      const at = px => svg.replace('<svg ', `<svg width="${px}" height="${px}" `);
      document.body.insertAdjacentHTML('beforeend', `
        <div class="c"><b>${name}</b>
          ${at(128)}
          <div class="row">${at(48)}${at(32)}${at(16)}</div>
          <div class="light">${at(32)}${at(16)}</div>
          <span>${note}</span></div>`);
    }
  });
</script>
